<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SL Weather - Precision</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        :root {
            --bg-gradient: linear-gradient(180deg, #4b4b7c 0%, #1c1c38 100%);
            --btn-gradient: linear-gradient(90deg, #a855f7 0%, #ec4899 100%);
            --text-main: #FFFFFF;
            --text-muted: rgba(255, 255, 255, 0.6);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: #0f0f1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        /* Mobile Device Container (for desktop preview simulation) */
        .app-container {
            width: 100%;
            max-width: 414px;
            height: 100vh;
            max-height: 896px;
            background: var(--bg-gradient);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 415px) {
            .app-container {
                height: 85vh;
                border-radius: 40px;
                border: 8px solid #000;
            }
        }

        /* Status Bar Simulation */
        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 20px 25px;
            font-size: 13px;
            font-weight: 600;
            z-index: 10;
        }
        
        .status-location {
            font-weight: 400;
            opacity: 0.8;
            font-size: 13px;
            transition: opacity 0.3s;
        }

        /* Screens */
        .screen {
            display: none;
            flex: 1;
            flex-direction: column;
            padding: 20px;
            animation: fadeIn 0.5s ease-out;
        }

        .screen.active {
            display: flex;
        }

        /* --- SCREEN 1: ONBOARDING --- */
        .s1-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            margin-top: -30px; 
        }

        .hero-asset {
            width: 200px;
            height: 200px;
            margin-bottom: 30px;
            /* Placeholder for the photorealistic 3D asset */
            background: url('https://cdn-icons-png.flaticon.com/512/3222/3222801.png') no-repeat center;
            background-size: contain;
            filter: drop-shadow(0px 20px 20px rgba(0,0,0,0.4));
            animation: float 4s ease-in-out infinite;
        }

        .hero-text {
            font-size: 18px;
            font-weight: 300;
            line-height: 1.5;
            color: var(--text-muted);
            margin-bottom: 70px;
            padding: 0 20px;
        }

        .hero-text strong {
            color: var(--text-main);
            font-weight: 700;
            display: block;
            margin-top: 10px;
            font-size: 20px;
            letter-spacing: 1px;
        }

        .btn-check-now {
            background: var(--btn-gradient);
            color: white;
            border: none;
            border-radius: 30px;
            padding: 18px 0;
            width: 75%;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(168, 85, 247, 0.4);
            transition: transform 0.2s;
            animation: pulse 2.5s infinite;
            margin-bottom: 40px;
            letter-spacing: 0.5px;
        }

        .btn-check-now:active {
            transform: scale(0.95);
        }

        /* Animations */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(236, 72, 153, 0); }
            100% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Mock Status Bar -->
        <div class="status-bar">
            <span>1:41</span>
            <span class="status-location" id="statusBarLocation">Sri Lanka</span>
            <span>📶 🔋</span>
        </div>

        <!-- SCREEN 1: ONBOARDING -->
        <div id="screen1" class="screen active">
            <div class="s1-content">
                <!-- 3D Cloud/Moon Placeholder -->
                <div class="hero-asset"></div>
                
                <div class="hero-text">
                    DISCOVER CLIMATE PRECISION,
                    <strong>SRI LANKA.</strong>
                </div>

                <button class="btn-check-now" onclick="goToScreen2()">Check now</button>
            </div>
        </div>

        <!-- SCREEN 2: COLOMBO DASHBOARD (Placeholder for next step) -->
        <div id="screen2" class="screen">
            <div class="s1-content">
                <h1 style="margin-bottom: 10px;">Colombo Dashboard</h1>
                <p style="color: var(--text-muted);">Waiting for Screen 2 instructions...</p>
            </div>
        </div>
    </div>

    <script>
        function goToScreen2() {
            // Hide screen 1
            document.getElementById('screen1').classList.remove('active');
            
            // Show screen 2
            document.getElementById('screen2').classList.add('active');
            
            // Update status bar location contextually
            document.getElementById('statusBarLocation').textContent = "Colombo";
            document.getElementById('statusBarLocation').style.opacity = '1';
        }
    </script>
</body>
</html>
