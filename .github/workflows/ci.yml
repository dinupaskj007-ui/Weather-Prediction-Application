name: Python CI

on:
  push:
    branches: [ "main", "working" ]
  pull_request:
    branches: [ "main", "working" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: requirements.txt

    - name: Install dependencies
      env:
        LINT_DEPENDENCY: ${{ matrix.python-version == '3.13' && 'flake8' || '' }}
      run: python -m pip install -r requirements.txt pytest ${LINT_DEPENDENCY:+"$LINT_DEPENDENCY"}

    - name: Lint with flake8 (syntax & undefined names)
      if: matrix.python-version == '3.13'
      run: |
        python -m flake8 app.py core scripts tests --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Lint with flake8 (style & complexity warnings)
      if: matrix.python-version == '3.13'
      run: |
        python -m flake8 app.py core scripts tests --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

    - name: Set up Node.js for frontend validation
      if: matrix.python-version == '3.13'
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Validate Service Worker Syntax
      if: matrix.python-version == '3.13'
      run: node --check static/sw.js

    - name: Validate Frontend Assets & Template Integrity
      if: matrix.python-version == '3.13'
      run: python scripts/validate_frontend.py

    - name: Test with pytest
      env:
        PYTHONDONTWRITEBYTECODE: '1'
      run: python -m pytest -v --tb=short
